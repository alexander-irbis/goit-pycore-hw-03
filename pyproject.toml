[project]
name = "goit-pycore-hw-03"
version = "0.1.0"
description = "GoIT PyCore homework #03."
readme = "README.md"
requires-python = ">=3.14,<4.0"
authors = [{ name = "Oleksandr Semychenkov", email = "alexander.semichenkov@gmail.com" }]

[tool.poetry]
packages = [{ include = "goit_pycore_hw_03", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

